worker_processes auto;
error_log /dev/stderr warn;
pid /dev/null;

events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  client_body_temp_path /tmp;
  proxy_temp_path /tmp;
  fastcgi_temp_path /tmp;
  uwsgi_temp_path /tmp;
  scgi_temp_path /tmp;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
      default_type text/plain;
      add_header Cache-Control "no-store";
      return 200 "ok\n";
    }

    # Preview links are mounted at /pr-<number>/. Strip that mount prefix so
    # the same immutable bundle also works at the preview host root.
    location ~ ^/pr-[0-9]+(?:/|$) {
      rewrite ^/pr-[0-9]+/?(.*)$ /$1 break;
      try_files $uri $uri/ /index.html;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
